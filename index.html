<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Bunyan Group — Process Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-mark">
    <span class="topbar-code" id="topbarCode">IDX</span>
    <span class="topbar-name" id="topbarName">Al-Bunyan Group</span>
  </div>
  <button class="back-btn" id="backBtn" hidden>&larr; All teams</button>
</header>

<main id="app"></main>

<footer class="titleblock">
  <div class="tb-cell tb-project">
    <span class="tb-label">Project</span>
    <span class="tb-value" id="tbProject">Process Overview</span>
  </div>
  <div class="tb-cell">
    <span class="tb-label">Sheet</span>
    <span class="tb-value" id="tbSheet">IDX–00</span>
  </div>
  <div class="tb-cell">
    <span class="tb-label">Legend</span>
    <span class="tb-value tb-legend">
      <span class="dot dot-sample"></span> Sample attached
      <span class="dot dot-workflow"></span> Workflow attached
    </span>
  </div>
</footer>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <span id="modalTitle"></span>
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- High-Fidelity Document & Spreadsheet Rendering Engines -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
